appId: com.agent.desktop
productName: Agent
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - "!node_modules"
mac:
  target:
    - dmg
    - zip
  artifactName: Agent-${version}-mac.${ext}
win:
  target:
    - nsis
  artifactName: Agent-${version}-win.${ext}
linux:
  target:
    - AppImage
  artifactName: Agent-${version}-linux.${ext}
